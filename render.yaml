services:
  - type: web
    name: binance-copy-monitor
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PORTFOLIO_ID
        value: "5075281354358777856"
      - key: CHECK_INTERVAL
        value: "5"
      - key: BURST_INTERVAL
        value: "3"
      - key: BURST_WINDOW
        value: "120"
      - key: JITTER
        value: "0.15"
      - key: TZ
        value: "Asia/Shanghai"
      - key: MAX_RUNTIME
        value: "0"
      - key: SEND_STARTUP
        value: "1"
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
